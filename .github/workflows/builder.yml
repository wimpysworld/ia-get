name: Builder 👷

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 0" # Weekly
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-code:
    name: Lint Code 🧹
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  lint-actions:
    name: Lint Action ⚙️
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: freerangebytes/setup-actionlint@32c8a5082cfc12c6aa71aeb22496372ea6ea15df # v0.1.2
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          actionlint -color

  test:
    name: Test 🧪
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run tests
        run: cargo test
      - name: Build release
        run: cargo build --release

  security:
    name: Security 🔒
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit --deny warnings
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure

  nix:
    name: Nix ❄️
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@57a29b403cbed0efb915f225f1212ad654c50e16
    permissions:
      id-token: write
      contents: read
    with:
      visibility: public

  sentinel:
    name: Sentinel 👁️
    needs: [lint-code, lint-actions, test, security, nix]
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: ${results}"
          if echo "${results}" | jq -e 'any(. == "failure" or . == "cancelled")' > /dev/null 2>&1; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed"

  build:
    name: Build ${{ matrix.os }}
    needs: [sentinel]
    if: always() && needs.sentinel.result == 'success' && github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          # zig cross-compiles static musl binaries for both Linux architectures.
          - os: linux
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          # The darwin targets need the macOS SDK.
          - os: darwin
            runner: macos-15
            targets: x86_64-apple-darwin,aarch64-apple-darwin
          # The Windows targets need MSVC.
          - os: windows
            runner: windows-2025
            targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install zig
        if: matrix.os == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Install cargo-zigbuild
        if: matrix.os == 'linux'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-zigbuild
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.20.0"
          args: release --clean --skip=sign ${{ startsWith(github.ref, 'refs/tags/') && '--skip=publish,announce' || '--snapshot' }} ${{ matrix.os != 'linux' && '--skip=nfpm' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.os }}
      - name: Collect release files
        run: |
          mkdir -p artifacts
          jq -r '.[] | select(.type == "Linux Package" or (.type == "Binary" and (.name | test("-(linux|darwin|windows)-(amd64|arm64)(\\.exe)?$")))) | [.path, .name] | @tsv' dist/artifacts.json |
            while IFS=$'\t' read -r path name; do
              cp "${path//\\//}" "artifacts/${name}"
            done
          ls -l artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ia-get-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Release 📦
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: ia-get-*
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.20.0"
          args: release --clean --skip=nfpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Nix cannot see the tag, so record the version in a commit on top of it.
          git checkout --detach "${RELEASE_TAG}^{commit}"
          if [[ -f nix/package.nix ]]; then
            printf '%s\n' "${RELEASE_TAG#v}" > nix/version
            git add nix/version
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --message "chore(nix): set the package version to ${RELEASE_TAG#v}"
          fi
          git tag --force latest HEAD
          git push --force origin refs/tags/latest
