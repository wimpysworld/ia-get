[package]
name = "ia-get"
categories = ["command-line-utilities"]
description = "File downloader for archive.org"
keywords = ["cli", "archive", "internet-archive", "download"]
authors = ["Martin Wimpress <code@wimpress.io>"]
license = "MIT"
repository = "https://github.com/wimpysworld/ia-get"
readme = "README.md"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crossterm = "0.29"
md5 = "0.8.0"
quick-xml = { version = "0.42", features = ["serialize"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "socks"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0.17"
unicode-width = "0.2"
url = "2.5.4"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
globset = "0.4"
fs4 = "0.13"
httpdate = "1"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "io-util"] }

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true
